# Serves the built React app and forwards /api to the API container.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Basic security headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Allow CSV uploads up to the API's 5 MB limit (plus form overhead).
    client_max_body_size 6m;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Built assets have content hashes in their names, so they can be cached for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single-page app: unknown paths (e.g. /inventory) load index.html and React Router takes over.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
